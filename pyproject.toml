[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "the-standard-agent"
version = "6.0.0.0"
description = "The Standard AI Agent Framework for Python: Agent = Orchestration(Data, Decision, Direction)."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-TSSL-1.1"
license-files = ["LICENSE.txt"]
authors = [{ name = "Hassan Habib", email = "hassanhabib@live.com" }]
keywords = ["agents", "llm", "the-standard", "tri-nature"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["xeption>=1.0.0.0", "restfulsense>=1.0.0.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/hassanhabib/The-Standard-Agent-Python"
Specification = "https://github.com/hassanhabib/The-Standard-Agent-Specs"
Source = "https://github.com/hassanhabib/The-Standard-Agent-Python"
Issues = "https://github.com/hassanhabib/The-Standard-Agent-Python/issues"
"C# Framework" = "https://github.com/hassanhabib/The-Standard-Agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
standard_agents = ["py.typed", "prompts/guardians/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "standard-agents"
version = "0.1.0.0"
description = "The Python port of The Standard AI Agent Framework: Agent = Orchestration(Data, Decision, Direction)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [{ name = "Hassan Habib", email = "hassanhabib@live.com" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["standard_agents*", "xeptions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

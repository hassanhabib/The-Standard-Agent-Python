name: Python Build
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    - users/hassanhabib/MAJOR-PORT-csharp-parity
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    env:
      STANDARD_AGENTS_VECTORS: reference/conformance/vectors
    steps:
    - name: Pulling Code
      uses: actions/checkout@v4
    - name: Pulling Conformance Vectors
      uses: actions/checkout@v4
      with:
        repository: hassanhabib/The-Standard-Agent
        path: reference
        sparse-checkout: conformance
    - name: Installing Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Installing Package
      run: python -m pip install -e ".[test]"
    - name: Running Tests
      run: python -m pytest -q
    - name: Running Example Agent
      run: python -m examples.calculator_agent
    - name: Certifying Core Conformance
      run: python -m conformance reference/conformance/vectors --profile Core
    - name: Certifying Reliable Conformance
      run: python -m conformance reference/conformance/vectors --profile Reliable
    - name: Certifying Enterprise Conformance
      run: python -m conformance reference/conformance/vectors --profile Enterprise
    - name: Certifying Critical Conformance
      run: python -m conformance reference/conformance/vectors --profile Critical
